services:
  db:
    image: postgres:16-alpine
    container_name: stageflow_db
    environment:
      POSTGRES_USER: stageflow
      POSTGRES_PASSWORD: stageflow
      POSTGRES_DB: stageflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stageflow -d stageflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: stageflow_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: StageFlow API
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg2://stageflow:stageflow@db:5432/stageflow
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-cle-de-developpement-a-remplacer}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
